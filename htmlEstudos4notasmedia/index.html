<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cálculo de Média</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Calculadora de Média</h1>
    <p>Digite uma nota de cada vez (total de 4):</p>
    <input type="number" id="notaInput" placeholder="Digite a nota" step="0.1" min="0" max="10" />
    <button onclick="adicionarNota()">Adicionar Nota</button>

    <ul id="listaNotas"></ul>

    <div id="resultado"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
